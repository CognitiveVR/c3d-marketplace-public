    # --- Sensor Aggregates ---
    # These are per-session aggregate stats (avg/min/max) from time-series sensor data.
    # Format: c3d.session.sensor.<sensorName>.<stat>
    # Common sensors: c3d.fps.avg, c3d.fps.1pl, c3d.fps.5pl, c3d.hmd.pitch, c3d.hmd.yaw,
    #   HMD Battery Level, HMD Battery State, heartrate, c3d.heartrate
    # Each has .avg, .min, .max variants.
    # Not individually listed here — discover via propertyNameQueries.

  # ===========================================================================
  # SESSION PROPERTIES — BOOLEAN
  # nestedFieldName: booleanSessionProp
  # ===========================================================================
  boolean:
    c3d.session_tag.test:
      description: Whether this session is tagged as a test session
      computedBy: backend
      displayName: Test Session
      displayTag: Common
    c3d.session_tag.junk:
      description: Whether this session is tagged as junk/invalid
      computedBy: backend
      displayName: Junk Session
      displayTag: Common
    c3d.app.inEditor:
      unnested: true
      description: Whether it was run in the editor
      computedBy: sdk
      displayName: In-Editor
      displayTag: App
      legacyNames: [cvr.app.inEditor]
    c3d.device.eyetracking.enabled:
      unnested: true
      description: Whether eye tracking was active
      computedBy: sdk
      displayName: Eyetracking Enabled
      displayTag: HMD
      legacyNames: [cvr.device.eyetracking.enabled]
    c3d.app.handtracking.enabled:
      description: Whether hand tracking was enabled
      computedBy: sdk
      displayName: Hand Tracking Enabled
      displayTag: App
    c3d.device.controllerinputs.enabled:
      description: Whether controller input tracking is enabled
      computedBy: sdk
      displayName: Controller Inputs Enabled
      displayTag: Device
    c3d.headphonespresent:
      description: Whether headphones were connected
      displayName: Headphones Enabled
      displayTag: Device
      computedBy: sdk
    c3d.hmd.RunningOnBattery:
      description: Whether the HMD was running on battery
      displayName: Running On Battery
      displayTag: HMD
      computedBy: sdk
    c3d.roomscale:
      description: Whether roomscale tracking was enabled
      displayName: Roomscale Enabled
      displayTag: User
      legacyNames: [cvr.roomscale]
      computedBy: sdk

    # --- XRPF Privacy ---
    xrpf.allowed.location.data:
      description: User consented to location data collection
      displayName: User Allowed Location Data
      displayTag: XRPF
      computedBy: sdk
    xrpf.allowed.hardware.data:
      description: User consented to hardware data collection
      displayName: User Allowed Hardware Data
      displayTag: XRPF
      computedBy: sdk
    xrpf.allowed.bio.data:
      description: User consented to biometric data collection
      displayName: User Allowed Biometric Data
      displayTag: XRPF
      computedBy: sdk
    xrpf.allowed.spatial.data:
      description: User consented to spatial data collection
      displayName: User Allowed Spatial Data
      displayTag: XRPF
      computedBy: sdk
    xrpf.allowed.social.data:
      description: User consented to social data collection
      displayName: User Allowed Social Data
      displayTag: XRPF
      computedBy: sdk

# =============================================================================
# EVENT PROPERTIES — TEXTUAL
# nestedFieldName: textualEventProp
# =============================================================================
event_properties:
  textual:
    questionSetId:
      description: ExitPoll question set identifier (only on cvr.exitpoll events)
      displayName: Question Set ID
      displayTag: ExitPoll
      computedBy: sdk
    hook:
      description: ExitPoll hook name (only on cvr.exitpoll events)
      displayName: Hook Name
      displayTag: ExitPoll
      computedBy: sdk
    # Note: most event properties are custom per-application.
    # Use propertyNameQueries to discover them.

  numerical:
    # Event-level numerical properties are typically custom.
    # Use propertyNameQueries to discover them.
    {}

  boolean:
    # Event-level boolean properties are typically custom.
    # Use propertyNameQueries to discover them.
    {}

# =============================================================================
# WELL-KNOWN EVENT NAMES
# Not exhaustive — use fieldValuesQueries on eventName to get the full list.
# =============================================================================
well_known_event_names:
  c3d.sessionStart:
    description: Fired when a session begins
    displayName: Session Start
    displayTag: Event
  c3d.sessionEnd:
    description: Fired when a session ends
    displayName: Session End
    displayTag: Event
  c3d.SceneChange:
    description: Fired when the user transitions between scenes
    displayName: Scene Change
    displayTag: Event
  c3d.userIdleStart:
    description: Fired when the user becomes idle
    displayName: User Idle Start
    displayTag: Event
  c3d.userIdleEnd:
    description: Fired when the user resumes from idle
    displayName: User Idle End
    displayTag: Event
  cvr.exitpoll:
    description: Fired when an exit poll is presented to the user
    displayName: ExitPoll Instance
    displayTag: Event
